<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator Angka Acak</title>
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#1b2430;--mute:#5d6b7c;--line:#d3dae4;--acc:#2b4bdb;--accink:#fff;--chip:#e4e9f7;--ok:#16794c;--warn:#a35a00}
@media (prefers-color-scheme:dark){:root{--bg:#141a24;--panel:#1c2431;--ink:#e8edf5;--mute:#93a1b4;--line:#2d3849;--acc:#7e96ff;--accink:#10162b;--chip:#27324a;--ok:#5fd3a0;--warn:#f0b35a}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(24px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
main{max-width:960px;margin:0 auto}
h1{font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.15;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px;max-width:70ch}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:18px}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mute);gap:4px}
label.chk,label.mini{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:1rem}
label.mini{font-size:.9rem;gap:6px}
label.dim{opacity:.45}
fieldset.scales{display:flex;gap:14px;align-items:center;margin:0;border:1px solid var(--line);border-radius:6px;padding:4px 12px 8px}
fieldset.scales legend{font-size:.85rem;color:var(--mute);padding:0 4px}
.customBox{display:flex;gap:12px;align-items:end}
select,input[type=number],input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
select{min-width:150px}
#count{width:130px}
.customBox input{width:150px}
#apikey{min-width:300px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px}
button.primary{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.55;cursor:wait}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.spacer{flex:1}
#status{font-size:.9rem;color:var(--mute);margin:0 0 14px;min-height:1.4em}
h2.sec{font-size:1.25rem;margin:24px 0 10px}
.row{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.row.real{border-left-color:var(--ok)}
.row.fallback{border-left-color:var(--warn)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.range{font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.src{font-size:.82rem;color:var(--mute)}
.row.real .src{color:var(--ok)}
.row.fallback .src{color:var(--warn)}
.nums{display:flex;flex-wrap:wrap;gap:5px}
